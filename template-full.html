<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'NotoSerifHK';
    src: url('fonts/NotoSerifHK.ttf');
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1264px;
    height: 1680px;
    background-color: #E2E6DF;
    font-family: 'NotoSerifHK', 'Songti TC', 'PMingLiU', serif;
    color: #2B4C59;
    padding: 40px;
  }
  .page {
    width: 100%;
    height: 100%;
    border: 6px solid #2B4C59;
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }
  /* Top Header */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 4px double #2B4C59;
    padding-bottom: 14px;
  }
  .year-block { font-size: 56px; font-weight: 900; color: #2B4C59; }
  .year-sub { font-size: 24px; font-weight: 700; }
  .zodiac-medallion {
    width: 88px; height: 88px;
    border-radius: 50%;
    background-color: #982B2B;
    color: #E2E6DF;
    font-size: 48px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 4px solid #2B4C59;
  }
  .month-block { text-align: right; font-size: 56px; font-weight: 900; }
  .month-sub { font-size: 22px; letter-spacing: 3px; }

  /* Center Hero Stage */
  .hero-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    padding: 16px 0;
  }
  .top-pill {
    background-color: #982B2B;
    color: #E2E6DF;
    padding: 6px 36px;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 10px;
    border: 2px solid #982B2B;
  }
  .hero-main {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 10px 0;
  }
  .red-couplet {
    background-color: #982B2B;
    color: #E2E6DF;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 42px;
    font-weight: 800;
    padding: 24px 16px;
    letter-spacing: 8px;
    border: 4px double #E2E6DF;
    height: 460px;
    text-align: center;
  }
  .center-number-cat {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    flex: 1;
  }
  .big-num {
    font-size: 460px;
    font-weight: 900;
    color: #982B2B;
    line-height: 0.82;
  }
  .cat-cutout {
    max-height: 360px;
    margin-left: -20px;
  }

  /* Sub-Hero Bar (Solar Term | Weekday | Lunar) */
  .sub-hero-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid #2B4C59;
    padding-bottom: 14px;
  }
  .side-cartouche {
    border: 2px solid #2B4C59;
    border-radius: 12px;
    padding: 10px 28px;
    text-align: center;
    min-width: 240px;
  }
  .cartouche-title { font-size: 40px; font-weight: 900; color: #982B2B; }
  .cartouche-sub { font-size: 22px; font-weight: 700; }
  .weekday-center { text-align: center; }
  .weekday-cn { font-size: 76px; font-weight: 900; color: #982B2B; letter-spacing: 10px; }
  .weekday-en { font-size: 26px; font-weight: 800; letter-spacing: 6px; }

  /* Almanac Grid */
  .almanac-grid {
    display: grid;
    grid-template-columns: 200px 1fr 200px;
    gap: 16px;
    margin: 14px 0;
  }
  .yi-ji-box {
    border: 2px solid #2B4C59;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .yj-header {
    width: 64px; height: 64px;
    color: #E2E6DF;
    font-size: 40px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
  }
  .yj-yi { background-color: #982B2B; }
  .yj-ji { background-color: #3A5A60; }
  .yj-body {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 30px;
    font-weight: 700;
    line-height: 1.5;
    letter-spacing: 4px;
  }
  .mid-table {
    border: 2px solid #2B4C59;
    padding: 12px 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    font-size: 28px;
    font-weight: 700;
  }
  .mid-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #2B4C59;
    padding: 6px 0;
  }
  .mid-row:last-child { border-bottom: none; }
  .row-tag {
    background-color: #3A5A60;
    color: #E2E6DF;
    padding: 4px 12px;
    font-size: 24px;
    border-radius: 4px;
  }

  /* 12 Two-Hour Lucky Table (時辰吉凶) */
  .hours-table {
    width: 100%;
    border-collapse: collapse;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
  }
  .hours-table th, .hours-table td {
    border: 2px solid #2B4C59;
    padding: 6px 4px;
  }
  /* Bottom Weather Strip */
  .bottom-strip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 8px;
    font-size: 36px;
    font-weight: 900;
  }
  .bottom-temp { font-size: 52px; color: #982B2B; }
</style>
</head>
<body>
  <div class="page">
    <div class="top-bar">
      <div>
        <div class="year-block" id="year-num">2026</div>
        <div class="year-sub" id="ganzhi-year">丙午年・馬年</div>
      </div>
      <div class="zodiac-medallion" id="zodiac-char">馬</div>
      <div>
        <div class="month-block" id="month-cn">十一月</div>
        <div class="month-sub" id="month-en">NOVEMBER</div>
      </div>
    </div>

    <div class="hero-stage">
      <div class="top-pill" id="season-banner">秋天呢人</div>
      <div class="hero-main">
        <div class="red-couplet" id="left-couplet">霜降熱到開冷氣</div>
        <div class="center-number-cat">
          <div class="big-num" id="day-num">1</div>
          <img class="cat-cutout" id="cat-img" src="assets/cat-wave.png" alt="cat" />
        </div>
        <div class="red-couplet" id="right-couplet">周日訓到唔願起</div>
      </div>
    </div>

    <div class="sub-hero-bar">
      <div class="side-cartouche">
        <div class="cartouche-title" id="solar-term">霜降</div>
        <div class="cartouche-sub" id="solar-sub">節氣交換</div>
      </div>
      <div class="weekday-center">
        <div class="weekday-cn" id="dow-cn">星期日</div>
        <div class="weekday-en" id="dow-en">SUNDAY</div>
      </div>
      <div class="side-cartouche">
        <div class="cartouche-sub">農曆</div>
        <div class="cartouche-title" id="lunar-str" style="color:#2B4C59;">廿三</div>
      </div>
    </div>

    <div class="almanac-grid">
      <div class="yi-ji-box">
        <div class="yj-header yj-yi">宜</div>
        <div class="yj-body" id="yi-text">週末東風和暖去飲杯奶茶</div>
      </div>
      <div class="mid-table">
        <div class="mid-row"><span class="row-tag">沖煞</span><span id="chong-sha">沖肖雞・煞西壞</span></div>
        <div class="mid-row"><span class="row-tag">值日</span><span id="zhiri">執日・執生為上</span></div>
        <div class="mid-row"><span class="row-tag">方位</span><span id="directions">財神正北・喜神東北</span></div>
        <div class="mid-row"><span class="row-tag">吉時</span><span id="lucky-hours">晨遲・食宴・瞌眼</span></div>
      </div>
      <div class="yi-ji-box">
        <div class="yj-header yj-ji">忌</div>
        <div class="yj-body" id="ji-text">信霜降轉涼著定厚衫出街</div>
      </div>
    </div>

    <table class="hours-table">
      <tr>
        <th>時辰</th><th>子</th><th>丑</th><th>寅</th><th>卯</th><th>辰</th><th>巳</th><th>午</th><th>未</th><th>申</th><th>酉</th><th>戌</th><th>亥</th>
      </tr>
      <tr>
        <td>吉凶</td><td>吉</td><td>凶</td><td>吉</td><td>吉</td><td>凶</td><td>凶</td><td>吉</td><td>吉</td><td>凶</td><td>吉</td><td>凶</td><td>凶</td>
      </tr>
    </table>

    <div class="bottom-strip">
      <div class="bottom-temp" id="temp-str">26°C</div>
      <div id="weather-desc">多雲・短暫有陽光</div>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    const D = window.CALENDAR_DATA || {};
    if (D.year) document.getElementById('year-num').textContent = D.year;
    if (D.month_cn) document.getElementById('month-cn').textContent = D.month_cn;
    if (D.month_en) document.getElementById('month-en').textContent = D.month_en;
    if (D.day) document.getElementById('day-num').textContent = D.day;
    if (D.weekday_cn) document.getElementById('dow-cn').textContent = D.weekday_cn;
    if (D.weekday_en) document.getElementById('dow-en').textContent = D.weekday_en;
    if (D.lunar) document.getElementById('lunar-str').textContent = D.lunar;
    if (D.cat_image) document.getElementById('cat-img').src = D.cat_image;
    if (D.temp) document.getElementById('temp-str').textContent = D.temp + '°C';
    if (D.weather_desc) document.getElementById('weather-desc').textContent = D.weather_desc;
  </script>
</body>
</html>
