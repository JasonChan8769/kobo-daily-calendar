<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'NotoSerifHK';
    src: url('fonts/NotoSerifHK.ttf');
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1264px;
    height: 1680px;
    background-color: #E2E6DF;
    font-family: 'NotoSerifHK', 'Songti TC', 'PMingLiU', serif;
    color: #2B4C59;
    padding: 36px;
  }
  .page {
    width: 100%;
    height: 100%;
    border: 6px solid #2B4C59;
    padding: 22px 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 4px double #2B4C59;
    padding-bottom: 12px;
  }
  .year-block { font-size: 54px; font-weight: 900; color: #2B4C59; }
  .year-sub { font-size: 24px; font-weight: 700; }
  .zodiac-medallion {
    width: 86px; height: 86px;
    border-radius: 50%;
    background-color: #982B2B;
    color: #E2E6DF;
    font-size: 46px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 4px solid #2B4C59;
  }
  .month-block { text-align: right; font-size: 52px; font-weight: 900; }
  .month-size {
    display: inline-block;
    border: 3px solid #982B2B;
    color: #982B2B;
    font-size: 28px;
    padding: 2px 8px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .month-sub { font-size: 22px; letter-spacing: 3px; text-align: right; }

  /* Center Hero Stage */
  .hero-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    padding: 12px 0;
  }
  .top-pill {
    background-color: #982B2B;
    color: #E2E6DF;
    padding: 6px 36px;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 6px;
    border: 2px solid #982B2B;
  }
  .hero-main {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 8px 0;
  }
  .red-couplet {
    background-color: #982B2B;
    color: #E2E6DF;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 40px;
    font-weight: 800;
    padding: 20px 16px;
    letter-spacing: 6px;
    border: 4px double #E2E6DF;
    height: 440px;
    text-align: center;
  }
  .center-number-cat {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    flex: 1;
  }
  .big-num {
    font-size: 430px;
    font-weight: 900;
    color: #982B2B;
    line-height: 0.82;
    letter-spacing: -10px;
  }
  .cat-cutout {
    max-height: 350px;
    margin-left: -16px;
  }

  /* Sub-Hero Bar */
  .sub-hero-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid #2B4C59;
    padding-bottom: 12px;
  }
  .side-cartouche {
    border: 2px solid #2B4C59;
    border-radius: 12px;
    padding: 8px 24px;
    text-align: center;
    min-width: 250px;
  }
  .cartouche-title { font-size: 38px; font-weight: 900; color: #982B2B; }
  .cartouche-sub { font-size: 20px; font-weight: 700; }
  .weekday-center { text-align: center; }
  .weekday-cn { font-size: 72px; font-weight: 900; color: #982B2B; letter-spacing: 10px; }
  .weekday-en { font-size: 24px; font-weight: 800; letter-spacing: 6px; }

  /* Almanac Grid */
  .almanac-grid {
    display: grid;
    grid-template-columns: 190px 1fr 190px;
    gap: 14px;
    margin: 10px 0;
  }
  .yi-ji-box {
    border: 2px solid #2B4C59;
    padding: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .yj-header {
    width: 60px; height: 60px;
    color: #E2E6DF;
    font-size: 38px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
  }
  .yj-yi { background-color: #982B2B; }
  .yj-ji { background-color: #3A5A60; }
  .yj-body {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 28px;
    font-weight: 700;
    line-height: 1.5;
    letter-spacing: 3px;
    max-height: 250px;
  }
  .mid-table {
    border: 2px solid #2B4C59;
    padding: 10px 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    font-size: 25px;
    font-weight: 700;
  }
  .mid-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #2B4C59;
    padding: 6px 0;
  }
  .mid-row:last-child { border-bottom: none; }
  .row-tag {
    background-color: #3A5A60;
    color: #E2E6DF;
    padding: 4px 10px;
    font-size: 22px;
    border-radius: 4px;
    margin-right: 12px;
    white-space: nowrap;
  }
  .luck-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 16px;
    flex: 1;
    font-size: 22px;
  }
  .pos-grid {
    display: flex;
    justify-content: space-around;
    flex: 1;
    text-align: center;
    font-size: 20px;
  }
  .pos-place { font-size: 26px; color: #982B2B; font-weight: 900; }

  /* 12 Two-Hour Lucky Table */
  .hours-table {
    width: 100%;
    border-collapse: collapse;
    text-align: center;
    font-size: 22px;
    font-weight: 700;
  }
  .hours-table th, .hours-table td {
    border: 2px solid #2B4C59;
    padding: 5px 2px;
  }
  .ji-dot {
    display: inline-block;
    width: 30px; height: 30px;
    line-height: 30px;
    border-radius: 50%;
    background-color: #982B2B;
    color: #E2E6DF;
  }
  .bottom-strip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 6px;
    font-size: 30px;
    font-weight: 900;
  }
  .bottom-temp { font-size: 48px; color: #982B2B; }
</style>
</head>
