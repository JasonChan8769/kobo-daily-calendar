<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'NotoSerifHK';
    src: url('fonts/NotoSerifHK.ttf');
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1264px;
    height: 1680px;
    background-color: #EFECE6;
    font-family: 'NotoSerifHK', 'Songti TC', 'PMingLiU', serif;
    color: #1E3A5F;
    padding: 44px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .outer-frame {
    width: 100%;
    height: 100%;
    border: 6px solid #1E3A5F;
    padding: 8px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .inner-frame {
    width: 100%;
    height: 100%;
    border: 2px solid #1E3A5F;
    padding: 32px 42px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }
  .corner {
    width: 34px; height: 34px;
    border: 3px solid #9E2A2B;
    position: absolute;
  }
  .tl { top: 12px; left: 12px; border-right: none; border-bottom: none; }
  .tr { top: 12px; right: 12px; border-left: none; border-bottom: none; }
  .bl { bottom: 12px; left: 12px; border-right: none; border-top: none; }
  .br { bottom: 12px; right: 12px; border-left: none; border-top: none; }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 3px solid #1E3A5F;
    padding-bottom: 16px;
    font-weight: 800;
  }
  .header-month { font-size: 56px; color: #1E3A5F; }
  .header-year { font-size: 68px; color: #9E2A2B; letter-spacing: 4px; }
  .header-jp-dow { font-size: 52px; color: #1E3A5F; }

  /* Main Hero Section */
  .hero {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex: 1;
    padding: 16px 0;
    position: relative;
  }
  .almanac-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 116px;
  }
  .badge {
    width: 78px; height: 78px;
    border-radius: 12px;
    color: #EFECE6;
    font-size: 46px;
    font-weight: 900;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 22px;
    box-shadow: inset 0 0 0 3px #EFECE6;
  }
  .badge.yi { background-color: #9E2A2B; border: 3px solid #9E2A2B; }
  .badge.ji { background-color: #1E3A5F; border: 3px solid #1E3A5F; }
  .vertical-text {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: 5px;
    line-height: 1.45;
    max-height: 540px;
  }

  /* Center Big Day + Cat */
  .center-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    position: relative;
  }
  .day-cat-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    height: 600px;
  }
  .cat-hero {
    max-height: 460px;
    width: auto;
    z-index: 2;
    margin-right: -30px;
  }
  .big-day {
    font-size: 520px;
    font-weight: 900;
    color: #9E2A2B;
    line-height: 0.85;
    z-index: 1;
    letter-spacing: -12px;
  }
  .holiday-label {
    font-size: 52px;
    font-weight: 800;
    color: #9E2A2B;
    margin-top: 8px;
  }
  .weekday-cn {
    font-size: 92px;
    font-weight: 900;
    color: #1E3A5F;
    letter-spacing: 12px;
    margin: 4px 0;
  }
  .lunar-date {
    font-size: 42px;
    font-weight: 700;
    color: #1E3A5F;
    letter-spacing: 6px;
  }

  /* 5-Day Forecast Strip */
  .forecast-box {
    border: 3px solid #9E2A2B;
    border-radius: 16px;
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  .moon-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-right: 28px;
    border-right: 2px solid #1E3A5F;
    min-width: 145px;
  }
  .moon-icon {
    width: 68px; height: 68px;
    border-radius: 50%;
    border: 3px solid #1E3A5F;
    background: linear-gradient(90deg, #1E3A5F 50%, transparent 50%);
    margin-bottom: 8px;
  }
  .moon-label { font-size: 28px; font-weight: 700; }
  .forecast-days {
    display: flex;
    justify-content: space-around;
    flex: 1;
  }
  .f-day {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 28px;
    font-weight: 700;
  }
  .f-icon {
    width: 54px;
    height: 54px;
    margin: 8px 0;
  }
  .f-temp { font-size: 26px; font-weight: 700; }

  /* Bottom Weather Summary */
  .weather-footer {
    border-top: 3px solid #1E3A5F;
    padding-top: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .weather-desc {
    font-size: 34px;
    font-weight: 700;
    line-height: 1.4;
    flex: 1;
    padding: 0 24px;
    white-space: pre-line;
  }
  .temp-now {
    font-size: 54px;
    font-weight: 900;
    color: #9E2A2B;
  }
  .weather-stamp {
    border: 3px solid #9E2A2B;
    color: #9E2A2B;
    font-size: 28px;
    font-weight: 900;
    padding: 6px 10px;
    writing-mode: vertical-rl;
  }
</style>
</head>
<body>

    <div class="inner-frame">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>

      <div class="hero">
        <div class="almanac-col">
          <div class="badge yi">宜</div>
          <div class="vertical-text" id="yi-text">著返件褸</div>
        </div>

        <div class="center-stage">
          <div class="day-cat-wrap">
            <img class="cat-hero" id="cat-img" src="assets/cat-wave.png" alt="cat" />
            <div class="big-day" id="day-num">11</div>
          </div>
          <div class="holiday-label" id="holiday-name">返工日</div>
          <div class="weekday-cn" id="dow-cn">星期三</div>
          <div class="lunar-date" id="lunar-str">十月初三</div>
        </div>

        <div class="almanac-col">
          <div class="badge ji">忌</div>
          <div class="vertical-text" id="ji-text">短袖出街</div>
        </div>
      </div>

      <div class="forecast-box">
        <div class="moon-box">
          <div class="moon-icon" id="moon-graphic"></div>
          <div class="moon-label" id="moon-phase">新月</div>
        </div>
        <div class="forecast-days" id="forecast-list"></div>
      </div>

      <div class="weather-footer">
        <div class="temp-now" id="temp-str">24°C</div>
        <div class="weather-desc" id="weather-desc">天氣漸涼</div>
        <div class="weather-stamp">天氣</div>
      </div>
    </div>
  </div>
