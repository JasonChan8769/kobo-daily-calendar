<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'NotoSerifHK';
    src: url('fonts/NotoSerifHK.ttf');
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1264px;
    height: 1680px;
    background-color: #EFECE6;
    font-family: 'NotoSerifHK', 'Songti TC', 'PMingLiU', serif;
    color: #1E3A5F;
    padding: 48px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .outer-frame {
    width: 100%;
    height: 100%;
    border: 6px solid #1E3A5F;
    padding: 8px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .inner-frame {
    width: 100%;
    height: 100%;
    border: 2px solid #1E3A5F;
    padding: 36px 44px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }
  /* Corner Fretwork Accents */
  .corner {
    width: 36px; height: 36px;
    border: 3px solid #A62B2B;
    position: absolute;
  }
  .tl { top: 12px; left: 12px; border-right: none; border-bottom: none; }
  .tr { top: 12px; right: 12px; border-left: none; border-bottom: none; }
  .bl { bottom: 12px; left: 12px; border-right: none; border-top: none; }
  .br { bottom: 12px; right: 12px; border-left: none; border-top: none; }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 3px solid #1E3A5F;
    padding-bottom: 18px;
    font-weight: 700;
  }
  .header-month { font-size: 56px; color: #1E3A5F; }
  .header-year { font-size: 68px; color: #A62B2B; letter-spacing: 4px; }
  .header-jp-dow { font-size: 52px; color: #1E3A5F; }

  /* Main Hero Section */
  .hero {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex: 1;
    padding: 20px 0;
    position: relative;
  }
  .almanac-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 110px;
  }
  .badge {
    width: 76px; height: 76px;
    border-radius: 12px;
    color: #EFECE6;
    font-size: 46px;
    font-weight: 900;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 24px;
    box-shadow: inset 0 0 0 3px #EFECE6;
  }
  .badge.yi { background-color: #9E2A2B; border: 3px solid #9E2A2B; }
  .badge.ji { background-color: #1E3A5F; border: 3px solid #1E3A5F; }
  .vertical-text {
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 6px;
    line-height: 1.4;
  }
  .yi-text { color: #1E3A5F; }
  .ji-text { color: #1E3A5F; }

  /* Center Big Day + Cat */
  .center-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    position: relative;
  }
  .day-cat-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    height: 620px;
  }
  .cat-hero {
    max-height: 480px;
    width: auto;
    z-index: 2;
    margin-right: -40px;
  }
  .big-day {
    font-size: 560px;
    font-weight: 900;
    color: #9E2A2B;
    line-height: 0.85;
    z-index: 1;
  }
  .holiday-label {
    font-size: 54px;
    font-weight: 800;
    color: #9E2B2B;
    margin-top: 10px;
  }
  .weekday-cn {
    font-size: 96px;
    font-weight: 900;
    color: #1E3A5F;
    letter-spacing: 12px;
    margin: 4px 0;
  }
  .lunar-date {
    font-size: 42px;
    font-weight: 700;
    color: #1E3A5F;
    letter-spacing: 6px;
  }

  /* 5-Day Forecast Strip */
  .forecast-box {
    border: 3px solid #9E2A2B;
    border-radius: 16px;
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .moon-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-right: 28px;
    border-right: 2px solid #1E3A5F;
  }
  .moon-icon {
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 3px solid #1E3A5F;
    background: linear-gradient(90deg, #1E3A5F 50%, transparent 50%);
    margin-bottom: 8px;
  }
  .moon-label { font-size: 30px; font-weight: 700; }
  .forecast-days {
    display: flex;
    justify-content: space-around;
    flex: 1;
  }
  .f-day {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 28px;
    font-weight: 700;
  }
  .f-temp { font-size: 26px; margin-top: 8px; }

  /* Bottom Weather Summary */
  .weather-footer {
    border-top: 3px solid #1E3A5F;
    padding-top: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .weather-desc {
    font-size: 36px;
    font-weight: 700;
    line-height: 1.4;
    flex: 1;
    padding: 0 24px;
  }
  .temp-now {
    font-size: 48px;
    font-weight: 900;
    color: #9E2A2B;
  }
  .weather-stamp {
    border: 3px solid #9E2A2B;
    color: #9E2A2B;
    font-size: 28px;
    font-weight: 900;
    padding: 6px 10px;
    writing-mode: vertical-rl;
  }
</style>
</head>
<body>
  <div class="outer-frame">
    <div class="inner-frame">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>

      <div class="header">
        <div class="header-month" id="month-cn">十一月</div>
        <div class="header-year" id="year-num">2026</div>
        <div class="header-jp-dow" id="dow-jp">日曜日</div>
      </div>

      <div class="hero">
        <div class="almanac-col">
          <div class="badge yi">宜</div>
          <div class="vertical-text yi-text" id="yi-text">週末東風和暖去飲</div>
        </div>

        <div class="center-stage">
          <div class="day-cat-wrap">
            <img class="cat-hero" id="cat-img" src="assets/cat-wave.png" alt="cat" />
            <div class="big-day" id="day-num">1</div>
          </div>
          <div class="holiday-label" id="holiday-name">休日</div>
          <div class="weekday-cn" id="dow-cn">星期日</div>
          <div class="lunar-date" id="lunar-str">九月廿三</div>
        </div>

        <div class="almanac-col">
          <div class="badge ji">忌</div>
          <div class="vertical-text ji-text" id="ji-text">信霜降轉涼著定厚</div>
        </div>
      </div>

      <div class="forecast-box">
        <div class="moon-box">
          <div class="moon-icon"></div>
          <div class="moon-label" id="moon-phase">下弦月</div>
        </div>
        <div class="forecast-days" id="forecast-list"></div>
      </div>

      <div class="weather-footer">
        <div class="temp-now" id="temp-str">28°C</div>
        <div class="weather-desc" id="weather-desc">漸轉多雲，短暫陽光，東風清勁。</div>
        <div class="weather-stamp">天氣</div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    const D = window.CALENDAR_DATA || {};
    if (D.month_cn) document.getElementById('month-cn').textContent = D.month_cn;
    if (D.year) document.getElementById('year-num').textContent = D.year;
    if (D.dow_jp) document.getElementById('dow-jp').textContent = D.dow_jp;
    if (D.day) document.getElementById('day-num').textContent = D.day;
    if (D.holiday || D.day_type) document.getElementById('holiday-name').textContent = D.holiday || D.day_type;
    if (D.weekday_cn) document.getElementById('dow-cn').textContent = D.weekday_cn;
    if (D.lunar) document.getElementById('lunar-str').textContent = D.lunar;
    if (D.yi) document.getElementById('yi-text').textContent = Array.isArray(D.yi) ? D.yi.join('') : D.yi;
    if (D.ji) document.getElementById('ji-text').textContent = Array.isArray(D.ji) ? D.ji.join('') : D.ji;
    if (D.cat_image) document.getElementById('cat-img').src = D.cat_image;
    if (D.temp) document.getElementById('temp-str').textContent = D.temp + '°C';
    if (D.weather_desc) document.getElementById('weather-desc').textContent = D.weather_desc;
    if (D.moon_phase) document.getElementById('moon-phase').textContent = D.moon_phase;

    const flist = document.getElementById('forecast-list');
    if (Array.isArray(D.forecast) && D.forecast.length) {
      flist.innerHTML = D.forecast.slice(0, 5).map(f => `
        <div class="f-day">
          <div>${f.dow || ''}</div>
          <div style="font-size:38px;margin:6px 0;">${f.icon || '☀️'}</div>
          <div class="f-temp">${f.min || ''}-${f.max || ''}°</div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
